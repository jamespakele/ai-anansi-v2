services:
  anansi:
    # Allows the anansi container to reach Ollama running on the host machine.
    # Mac/Windows: host.docker.internal works automatically — extra_hosts not needed.
    # Linux: this maps host.docker.internal → the host's Docker gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Temporary: mount skills from source repo until new image with baked skills is pulled.
      # Remove after: docker compose pull && docker compose up -d
      - /home/james/projects/ai-anansi-v2/skills:/data/skills:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://anansi:3738
    depends_on:
      - anansi
    restart: unless-stopped
