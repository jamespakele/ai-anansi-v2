[paths]
# All path fields have sensible defaults — section must be present but can be empty.

[server]
mcp_port = 3738
host = "0.0.0.0"
public_url = "https://anansi.pakele.ai"
api_key = "kip_ak_7f3e9d2b4a1c8056"

[llm]
backend = "ollama"
url     = "http://host.docker.internal:11434"
model   = "deepseek-v4-flash:0731-cloud"
timeout_s = 600

[llm.decomposition]
temperature = 0.2
max_tokens  = 32768
json_mode   = false

[llm.extraction]
temperature = 0.2
max_tokens  = 32768
json_mode   = false

[llm.synthesis]
temperature = 0.3
max_tokens  = 65536
json_mode   = false

# ── Ollama (local, no API key) ────────────────────────────────────────────────
# Requires Ollama installed on your machine with the model pulled.
# Switch by replacing the [llm] block above with:
#
# [llm]
# backend = "ollama"
# url     = "http://host.docker.internal:11434"
# model   = "qwen2.5:14b"
# timeout_s = 600

# ── OpenRouter (many models, one key) ─────────────────────────────────────────
# Set ANANSI_OPENROUTER_API_KEY in .env, then:
#
# [llm]
# backend = "openrouter"
# timeout_s = 300
#
# [llm.openrouter]
# model = "google/gemini-2.5-pro"

[inbox]
enabled = true
watch_dir  = "/data/q-inbox"
archive_dir = "/data/archive"
queue_dir  = "/data/q-atomize"
queue_poll_interval_secs = 10
# skills_dir defaults to /app/skills (baked into the image)
poll_interval_secs = 30
llm_backend = "ollama"


# ── DEPLOY NOTE (manual step on VPS) ─────────────────────────────────────────
# This file is the repo reference config. The running container bind-mounts
# /data/anansi/anansi.toml from the host VPS — this file is NOT auto-deployed.
# When you change the LLM backend here, you MUST also manually update:
#   /docker/ai-anansi-v2/data/anansi/anansi.toml
# and restart: docker restart ai-anansi-v2-anansi-1
# Otherwise the live container keeps using the old config.
