services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=anansi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=anansi
    volumes:
      - postgres-data:/var/lib/postgresql/data   # named volume — Docker managed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anansi -d anansi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  anansi:
    image: ghcr.io/jamespakele/anansi2:latest
    dns_search: []   # prevent Tailscale search domain from breaking Docker DNS
    ports:
      - "127.0.0.1:3738:3738"
    volumes:
      - ./anansi-data:/data
      - ./anansi.toml:/data/anansi/anansi.toml:ro  # config — edit this to switch LLM backend
      # Skills are baked into the image at /app/skills.
      # To use custom skills, mount them and set skills_dir in anansi.toml:
      # - ./my-skills:/app/skills:ro
    environment:
      - ANANSI_GEMINI_API_KEY=${ANANSI_GEMINI_API_KEY:-}
      - ANANSI_SKILL_TOKEN=${ANANSI_SKILL_TOKEN:-}
      - ANANSI_OPENROUTER_API_KEY=${ANANSI_OPENROUTER_API_KEY:-}
      - DATABASE_URL=postgres://anansi:${POSTGRES_PASSWORD}@db:5432/anansi
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:   # persistent, Docker-managed PostgreSQL storage
