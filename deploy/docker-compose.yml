# Anansi — local deploy
# Uses the pre-built image from GHCR — no source code or Rust toolchain needed.
#
# REQUIRED .env file (copy from .env.example):
#   POSTGRES_PASSWORD=<strong-random-password>
#   ANANSI_GEMINI_API_KEY=<your-key>   ← or use Ollama (see .env.example)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=anansi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=anansi
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anansi -d anansi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  anansi:
    image: ghcr.io/jamespakele/anansi2:latest
    ports:
      - "127.0.0.1:3738:3738"
    volumes:
      - ./data:/data
      # Skills are baked into the image at /app/skills.
      # To use custom skills, mount them and set skills_dir in anansi.toml:
      # - ./my-skills:/app/skills:ro
    environment:
      - ANANSI_GEMINI_API_KEY=${ANANSI_GEMINI_API_KEY:-}
      - ANANSI_SKILL_TOKEN=${ANANSI_SKILL_TOKEN:-}
      - ANANSI_OPENROUTER_API_KEY=${ANANSI_OPENROUTER_API_KEY:-}
      - DATABASE_URL=postgres://anansi:${POSTGRES_PASSWORD}@db:5432/anansi
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
