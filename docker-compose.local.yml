services:
  anansi:
    # Local dev: bind-mount the repo's llm/plugins skills so edits apply without a rebuild.
    # (Prod does NOT mount skills — it uses the image-baked /app/skills; set skills_dir
    #  to /app/skills there. Dev sets skills_dir = /data/skills to use this mount.)
    volumes:
      - ./llm/plugins/anansi.plugin/skills:/data/skills:ro
    # Allows the anansi container to reach Ollama running on the host machine.
    # Mac/Windows: host.docker.internal resolves automatically — extra_hosts not needed.
    # Linux: this entry maps host.docker.internal → the host's Docker gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://anansi:3738
    depends_on:
      - anansi
    restart: unless-stopped
