name: Build, Publish & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # needed to push to GHCR

jobs:
  publish:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anansi2
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: publish   # deploy after image is pushed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: ai-anansi-v2

          environment-variables: |
            ANANSI_GEMINI_API_KEY=${{ secrets.ANANSI_GEMINI_API_KEY }}
            ANANSI_SKILL_TOKEN=${{ secrets.ANANSI_SKILL_TOKEN }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
