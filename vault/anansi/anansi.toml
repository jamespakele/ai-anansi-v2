[paths]
web_dir      = "anansi/web"
rules_dir    = "anansi/%Rules"
templates_dir = "anansi/templates"
db_file      = "anansi/web.db"

[llm]
backend   = "ollama"
url       = "http://localhost:11434"
model     = "deepseek-v4-flash:0731-cloud"
n_ctx     = 16384
timeout_s = 600

[llm.decomposition]
temperature = 0.2
max_tokens  = 4096
json_mode   = false

[llm.extraction]
temperature = 0.2
max_tokens  = 4096
json_mode   = true

[llm.synthesis]
temperature = 0.5
max_tokens  = 16384
json_mode   = false

[server]
mcp_port  = 3738
host      = "0.0.0.0"
read_only = false
